<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Racer</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="1000" height="640"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// The game draws in logical units: always 640 high, and as wide as the window's shape allows (so a wide screen
// shows more track). PX = real pixels per unit, so everything is drawn sharp at any size. F toggles fullscreen.
let VW = 1000, VH = 640, PX = 1, lc = null, lx = null; // (lc: the night-lighting layer, sized to match)
function fitScreen() {
  const ww = innerWidth, wh = innerHeight, asp = Math.max(1.35, Math.min(2.4, ww / wh));
  VW = Math.round(640 * asp);
  const cssH = Math.min(wh, ww / asp), dpr = devicePixelRatio || 1;
  cv.style.width = cssH * asp + 'px'; cv.style.height = cssH + 'px';
  PX = cssH * dpr / 640; cv.width = Math.round(VW * PX); cv.height = Math.round(VH * PX);
  if (lc) { lc.width = VW; lc.height = VH; }
}
addEventListener('resize', fitScreen);
const setT = (a, b, c, d, e, f) => ctx.setTransform(a * PX, b * PX, c * PX, d * PX, e * PX, f * PX); // (in logical units)
function toggleFullscreen() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} }
const TW = 130;                          // track width
const PIT_W = 60, PIT_OFF = TW / 2 + 64; // pit lane width, and its centre offset from the track centreline
const AI_CORNER = .065, AI_DECEL = .22;   // AI corner speed per px of turn radius, and the braking it plans for
const TYRE_LIFE = [0, 6, 3.5], WEAR_NAMES = ['Off', 'Normal', 'High']; // laps of clean driving until tyres are ~30%
const PIT_STEP = 12, PIT_TIME = 180;      // spacing of pit-lane path points (px), and pit stop length (frames)
const QUALI_LAPS = 3;                     // laps in your qualifying session (best one counts)
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const rnd = (a, b) => a + Math.random() * (b - a);

// ---- Track definitions ----
const TRACKS = [
  { name: 'Green Valley', scenery: 'trees', street: [9, 11], runoff: 170,
    wp: [[300,1300],[1100,1300],[1800,1300],[2100,1150],[2150,900],[2100,550],[1900,320],[1700,420],[1650,700],[1450,820],
         [1300,700],[1150,820],[900,700],[800,450],[600,300],[350,350],[200,600],[250,900],[200,1150]].map(([x, y]) => [x * 1.5, y * 1.5]),
    pal: { asph: '#46464b', run: '#3f8f35', runSp: '#48a03c', grav: '#cbb27f', out: '#24521f', outSp: '#2a5a24', wall: '#d8d8d8' },
    names: ['Asphalt', 'Kerb', 'Grass', 'Gravel'] },
  { name: 'Downtown', scenery: 'city', street: 'all', runoff: 40,
    wp: [[400,1700],[1600,1700],[2600,1700],[2800,1500],[2800,1100],[2600,900],[2000,900],[1800,700],[1800,400],[1600,250],
         [1000,250],[800,450],[800,800],[600,1000],[400,1000],[250,1200],[250,1500]],
    pal: { asph: '#3a3a40', run: '#77777c', runSp: '#6e6e73', grav: '#cbb27f', out: '#2b2b31', outSp: '#323238', wall: '#e6e6e6' },
    names: ['Asphalt', 'Kerb', 'Pavement', 'Gravel'] },
  { name: 'Desert Loop', scenery: 'desert', street: null, runoff: 210, start: 24, // start further along so the pit lane is on the straight
    wp: [[400,1500],[1400,1600],[2400,1500],[3000,1100],[2900,600],[2400,400],[1900,700],[1500,500],[1000,300],[500,500],[300,900],[250,1200]],
    pal: { asph: '#4a4644', run: '#d2ad6e', runSp: '#c49c5c', grav: '#efd9a4', out: '#b07d44', outSp: '#a37240', wall: '#2a2a2a' },
    names: ['Asphalt', 'Kerb', 'Dirt', 'Sand'] },
  { name: 'Harbour Point', scenery: 'coast', street: [5, 6], runoff: 150, start: 24, // walled esses up the hillside
    wp: [[400,1650],[1500,1650],[2500,1650],[2950,1500],[3050,1150],[2800,900],[3000,650],[2850,420],[2650,250],
         [2400,400],[2100,700],[1700,600],[900,500],[550,400],[350,650],[450,950],[350,1200],[300,1450]],
    lagoon: [1700, 1080, 650, 230], // infield lagoon: centre x, y and radii (same coordinates as wp)
    pal: { asph: '#4a4a50', run: '#6f9d43', runSp: '#7aa94d', grav: '#e3d3a4', out: '#9c9a5a', outSp: '#a8a664', wall: '#f0f0f0' },
    names: ['Asphalt', 'Kerb', 'Grass', 'Gravel'] },
  { name: 'Maple Ridge', scenery: 'autumn', street: [10, 11], runoff: 150, start: 24, // clockwise; walled chicane at the bottom
    wp: [[500,300],[1600,300],[2700,300],[3100,450],[3150,800],[2900,1050],[3050,1300],[2850,1550],[2600,1750],
         [2350,1600],[2000,1650],[1800,1500],[1550,1650],[900,1700],[500,1550],[350,1200],[600,900],[350,600]],
    lagoon: [1700, 1000, 650, 240], // forest lake
    pal: { asph: '#47474c', run: '#6d8f3a', runSp: '#7a9a45', grav: '#cbb27f', out: '#5e6b2e', outSp: '#6a7735', wall: '#dcdcdc' },
    names: ['Asphalt', 'Kerb', 'Grass', 'Gravel'] },
  { name: 'Vineyard Hills', scenery: 'vineyard', street: [14, 15], runoff: 150, start: 24, // clockwise; walled hilltop village
    wp: [[400,300],[1500,300],[2600,300],[3050,430],[3250,800],[3150,1250],[2900,1650],[2450,1900],[1700,1950],[1100,1900],
         [750,1750],[750,1450],[1150,1350],[1750,1400],[2250,1200],[2150,850],[1600,800],[1000,850],[500,900],[300,600]].map(([x, y]) => [x * .88, y * .88]),
    pal: { asph: '#48474a', run: '#8c9c4a', runSp: '#97a655', grav: '#d9c28f', out: '#a08a5c', outSp: '#94804f', wall: '#e8e2d4' },
    names: ['Asphalt', 'Kerb', 'Grass', 'Gravel'] },
  { name: 'Monte Carlo', scenery: 'monaco', street: 'all', runoff: 40, start: 24, // clockwise street circuit round the harbour
    wp: [[400,1900],[400,1150],[400,400],                          // start straight (pits on the harbour side)
         [600,180],[1100,160],[1650,100],                         // Sainte Devote, up Beau Rivage
         [2050,-80],[2400,-150],[2700,-60],                       // Massenet, Casino Square
         [2850,200],[2880,520],[2920,760],[3050,860],[3180,770],[3220,560], // Mirabeau, Grand Hotel hairpin
         [3320,380],[3500,380],[3600,650],[3600,1250],[3420,1700], // Mirabeau bas, Portier, seafront curve
         [3000,1950],[2650,1980],[2480,1880],[2300,1980],         // Nouvelle Chicane
         [1950,1900],[1700,1800],[1500,1880],[1250,1880],[1050,1800], // Tabac, Swimming Pool
         [800,1850],[650,2100],[480,2200]].map(([x, y]) => [x * .85, y * .85]), // Rascasse, Anthony Noghes
    lagoon: [1530, 1062, 850, 357], shore: [170, 166, 156], sea: [3222, 1828], // harbour (stone quay); open sea east and south
    pal: { asph: '#3c3c42', run: '#7d7a78', runSp: '#74716f', grav: '#cbb27f', out: '#bdb2a0', outSp: '#b3a894', wall: '#ececec' },
    names: ['Asphalt', 'Kerb', 'Pavement', 'Gravel'] },
  { name: '6ix7seven', scenery: 'hoops', street: null, runoff: 55, start: 24, // the track spells "67"; the 6's loop crosses itself on a bridge
    wp: [[4000,700],[3200,700],[2400,700],                                   // the 7's top bar (start straight)
         [1700,780],[1250,1050],[980,1500],[900,2000],[960,2450],             // the 6: curving stem...
         [1437,3502],[1900,3670],[2409,3459],[2620,2950],[2409,2441],[1900,2230],[1391,2441],[1223,2704], // ...under the bridge and round the bowl
         [1000,3300],[1000,3800],                                             // over the bridge, crossing the stem
         [1300,4250],[2000,4400],[2700,4350],[3100,4150],                     // along the bottom to the 7's foot
         [3400,3450],[3800,2350],[4150,1400],[4380,780]].map(([x, y]) => [x * .62, y * .62]), // up the 7's diagonal to a sharp corner
    bridge: [14, 16, 6, 8], // waypoint ranges of the bridge (upper road) and of the road passing under it
    pal: { asph: '#44434a', run: '#5da347', runSp: '#68ad51', grav: '#d9c28f', out: '#3f7d34', outSp: '#46873a', wall: '#f0f0f0' },
    names: ['Asphalt', 'Kerb', 'Grass', 'Gravel'] },
  { name: 'Jeddah Corniche', scenery: 'corniche', street: 'all', runoff: 40, start: 24, // fast, flowing, walled; anticlockwise
    wp: [[600,1500],[1500,1500],[2400,1500],                                  // start straight
         [2800,1500],[2950,1390],[3120,1440],                                 // T1-T2 chicane
         [3420,1360],[3680,1460],[3940,1340],[4200,1440],[4470,1310],         // the fast esses
         [4700,1100],[4760,800],[4560,600],                                   // the big banked left (T13)
         [4200,600],[3800,700],[3400,600],[3000,690],[2600,590],[2200,670],[1800,580],[1400,650],[1000,570], // flat-out kinks along the sea
         [650,640],[430,850],[380,1150],[460,1400]],                          // the final hairpin onto the straight
    lagoon: [2600, 1050, 1600, 210], shore: [170, 166, 156], seaN: 420, // the marina inside, the Red Sea along the north side
    pal: { asph: '#3d3d43', run: '#86827a', runSp: '#7c7870', grav: '#cbb27f', out: '#d8cdb8', outSp: '#cfc3ac', wall: '#f2f2f2' },
    names: ['Asphalt', 'Kerb', 'Pavement', 'Gravel'] },
];

// Surfaces: 0 asphalt, 1 kerb, 2 runoff (grass/dirt), 3 gravel/sand, 4 wall
const SURF = [
  { drag: .993, grip: .15, acc: 1 },
  { drag: .99,  grip: .12, acc: .9 },
  { drag: .975, grip: .05, acc: .5 },
  { drag: .95,  grip: .04, acc: .35 },
];

// Track state (rebuilt by loadTrack)
let T, W, H, P, N, ang, turn, street, corner, ro, seglen, trackLen, cum, safe, md, tc, skc, sk, mm, MS, lamps, pit, bridge, topLaps = [];

function backIdx(d) { let i = 0, s = 0; while (s < d) { i = (i - 1 + N) % N; s += seglen[i]; } return i; }
function fwdIdx(d) { let i = 0, s = 0; while (s < d) { s += seglen[i]; i = (i + 1) % N; } return i; }
function along(i, d) { // point d px further along the centreline from sample i
  while (d > seglen[i]) { d -= seglen[i]; i = (i + 1) % N; }
  const p = P[i], q = P[(i + 1) % N], t = d / seglen[i];
  return { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t, a: ang[i] };
}
const offset = (p, o) => ({ x: p.x - Math.sin(p.a) * o, y: p.y + Math.cos(p.a) * o, a: p.a }); // o > 0 = right of travel

function loadTrack(ti) {
  T = TRACKS[ti];
  const xs = T.wp.map(p => p[0]), ys = T.wp.map(p => p[1]), M = 400;
  const ox = M - Math.min(...xs), oy = M - Math.min(...ys);
  const wp = T.wp.map(([x, y]) => [x + ox, y + oy]);
  T.shift = [ox, oy]; // so scenery given in waypoint coordinates (e.g. a lagoon) lines up
  W = Math.ceil(Math.max(...xs) + ox + M); H = Math.ceil(Math.max(...ys) + oy + M);

  // Closed Catmull-Rom spline through the waypoints
  P = [];
  for (let i = 0; i < wp.length; i++) {
    const n = wp.length, p0 = wp[(i - 1 + n) % n], p1 = wp[i], p2 = wp[(i + 1) % n], p3 = wp[(i + 2) % n];
    for (let s = 0; s < 24; s++) {
      const t = s / 24, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      P.push({ x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]), wp: i });
    }
  }
  P.push(...P.splice(0, T.start || 12)); // start/finish partway along the first straight
  N = P.length;
  ang = P.map((p, i) => { const q = P[(i + 1) % N]; return Math.atan2(q.y - p.y, q.x - p.x); });
  turn = P.map((_, i) => wrapA(ang[(i + 6) % N] - ang[(i - 6 + N) % N]));
  street = P.map(p => T.street === 'all' || (!!T.street && p.wp >= T.street[0] && p.wp <= T.street[1]));
  corner = turn.map(t => Math.abs(t) > 0.45);
  ro = P.map((_, i) => TW / 2 + (street[i] ? 38 : T.runoff)); // runoff half-width
  seglen = P.map((p, i) => { const q = P[(i + 1) % N]; return Math.hypot(q.x - p.x, q.y - p.y); });
  trackLen = seglen.reduce((a, b) => a + b, 0);
  cum = []; seglen.reduce((s, l, i) => (cum[i] = s) + l, 0); // distance from the start line to each sample
  safe = P.map((_, i) => { // AI corner speed from local curvature (heading change per px over ±40px)
    let a = i, b = i, da = 0, db = 0;
    while (da < 40) { a = (a - 1 + N) % N; da += seglen[a]; }
    while (db < 40) { db += seglen[b]; b = (b + 1) % N; }
    return clamp(AI_CORNER * (da + db) / Math.abs(wrapA(ang[b] - ang[a])), 3.5, 11);
  });
  buildPit();
  // Bridge, where the track crosses itself: the samples on the deck, the ones passing underneath (for as long as
  // a car is hidden below it), and a checkpoint halfway round the loop between them so it can't be skipped
  bridge = null;
  if (T.bridge) {
    const [u0, u1, l0, l1] = T.bridge; let bd = Infinity, iu = 0, il = 0;
    for (let i = 0; i < N; i++) if (P[i].wp >= u0 && P[i].wp <= u1)
      for (let j = 0; j < N; j++) if (P[j].wp >= l0 && P[j].wp <= l1) {
        const d = (P[i].x - P[j].x) ** 2 + (P[i].y - P[j].y) ** 2; if (d < bd) { bd = d; iu = i; il = j; }
      }
    const near = (c, r) => { const s = new Set(); for (let k = 0; k < N; k++) { const d = Math.abs(cum[k] - cum[c]); if (Math.min(d, trackLen - d) < r) s.add(k); } return s; };
    const upper = near(iu, 240);
    bridge = { upper, under: near(il, 190), deck: [...upper].sort((a, b) => a - b), mid: (il + (((iu - il + N) % N) >> 1)) % N };
  }

  // Surface map (flat colours, read back as data)
  const mc = mk(W, H), mx = mc.getContext('2d', { willReadFrequently: true });
  build(mx, { asph: 'rgb(0,0,0)', kerb: 'rgb(60,0,0)', run: 'rgb(120,0,0)', grav: 'rgb(180,0,0)', out: 'rgb(250,0,0)' }, false);
  md = mx.getImageData(0, 0, W, H).data;
  placeStands(); // before the scenery, which then builds around them

  // Visual track
  tc = mk(W, H); const v = tc.getContext('2d');
  build(v, T.pal, true);
  const pal = T.pal;
  for (let i = 0, n = W * H / 50; i < n; i++) { // texture specks
    const x = Math.random() * W, y = Math.random() * H, s = surf(x, y);
    if (s === 0) { v.fillStyle = Math.random() < .5 ? '#505056' : '#35353a'; v.fillRect(x, y, 2, 2); }
    else if (s === 3) { v.fillStyle = Math.random() < .5 ? '#b09766' : '#f4e2b4'; v.fillRect(x, y, 3, 3); }
    else if (s === 2) { v.fillStyle = pal.runSp; v.fillRect(x, y, 2, 4); }
    else if (s === 4) { v.fillStyle = pal.outSp; v.fillRect(x, y, 4, 4); }
  }
  scenery(v);
  // Lamp posts (also light up the track at night)
  lamps = [];
  for (let i = 0; i < N; i += 8) {
    const s = (i / 8) % 2 ? 1 : -1, a = ang[i], d = ro[i] + 20;
    if (s === pit.side && pit.set.has(i)) continue;
    const x = P[i].x - Math.sin(a) * s * d, y = P[i].y + Math.cos(a) * s * d;
    if (surf(x, y) !== 4 || inStand(x, y)) continue;
    lamps.push({ x, y });
    v.fillStyle = '#222'; v.beginPath(); v.arc(x, y, 5, 0, 7); v.fill();
    v.fillStyle = '#ffe9a8'; v.beginPath(); v.arc(x, y, 3, 0, 7); v.fill();
  }
  pitDecor(v);
  paintStands(v);
  // Start/finish checkered line
  v.save(); v.translate(P[0].x, P[0].y); v.rotate(ang[0]);
  for (let r = 0; r < 2; r++) for (let j = -TW / 2; j < TW / 2; j += 10) {
    v.fillStyle = ((r + Math.round(j / 10)) & 1) ? '#fff' : '#111'; v.fillRect(r * 8 - 8, j, 8, 10);
  }
  v.restore();

  // Minimap + skid layer
  // (drawn big once, then scaled down to whichever minimap size is chosen, and for the menu's track preview)
  MS = 360 / W; mm = mk(360, Math.ceil(H * MS)); const m = mm.getContext('2d');
  m.scale(MS, MS); m.lineCap = m.lineJoin = 'round';
  m.lineWidth = 110; m.strokeStyle = 'rgba(0,0,0,.55)'; runs(m, () => true); // dark outline
  m.lineWidth = 34; m.strokeStyle = '#7a7f88'; polyline(m, pit.path);
  m.lineWidth = 70; m.strokeStyle = '#e6e9ee'; runs(m, () => true);
  const s0 = offset({ x: P[0].x, y: P[0].y, a: ang[0] }, -60), s1 = offset({ x: P[0].x, y: P[0].y, a: ang[0] }, 60);
  m.lineWidth = 26; m.lineCap = 'butt'; m.strokeStyle = '#e33'; m.beginPath(); m.moveTo(s0.x, s0.y); m.lineTo(s1.x, s1.y); m.stroke(); // start line
  skc = mk(W, H); sk = skc.getContext('2d');
  // Facts for the menu's track card (1 px = half a metre)
  let bends = 0; for (let i = 0; i < N; i++) if (corner[i] && !corner[(i - 1 + N) % N]) bends++;
  T.info = { km: (trackLen / 2000).toFixed(1), cw: pit.side > 0, bends, kind: T.street === 'all' ? 'Street circuit' : 'Road course' };

  ghost = null; ghostTime = Infinity;
  try { topLaps = JSON.parse(localStorage.getItem('miniRacerTop_' + T.name)) || []; } catch (e) { topLaps = []; }
  cam = { x: P[0].x, y: P[0].y };
}

// Pit lane: runs alongside the main straight on the infield side, with ramps in and out.
// `path` is a point every PIT_STEP px from entry to exit; the AI follows it when it pits.
function buildPit() {
  const turnSum = ang.reduce((s, a, i) => s + wrapA(ang[(i + 1) % N] - a), 0);
  const side = turnSum > 0 ? 1 : -1; // the infield is on the side the circuit turns towards
  const entry = backIdx(660), exit = fwdIdx(560), idxs = [];
  for (let i = entry; i !== exit; i = (i + 1) % N) idxs.push(i);
  let L = 0; for (const i of idxs) L += seglen[i];
  const RIN = 300, ROUT = 170, inner = TW / 2 - PIT_W / 2; // long gentle way in (cars arrive quick), shorter way out
  const path = [];
  for (let d = 0; d <= L; d += PIT_STEP) { // smooth S-curve from the track edge out to the pit lane and back
    const r = clamp(Math.min(d / RIN, (L - d) / ROUT), 0, 1), s = r * r * (3 - 2 * r);
    path.push({ ...offset(along(entry, d), side * (inner + (PIT_OFF - inner) * s)), full: r >= 1 });
  }
  const boxes = [], boxPath = [], garages = [], wall = [];
  for (let d = RIN + 50; d < L - ROUT - 40; d += 58) {
    const c = along(entry, d);
    boxes.push(offset(c, side * (PIT_OFF + 10)));
    boxPath.push(Math.round(d / PIT_STEP));
    garages.push(offset(c, side * (PIT_OFF + PIT_W / 2 + 26)));
  }
  for (let d = RIN - 30; d <= L - ROUT + 30; d += 20) wall.push(offset(along(entry, d), side * (TW / 2 + 17)));
  const approach = new Set(); // the 700px of track before the pit entry, where pitting cars line up for it
  for (let i = entry, d = 0; d < 700; ) { i = (i - 1 + N) % N; d += seglen[i]; approach.add(i); }
  pit = { side, entry, exit, len: L, path, boxes, boxPath, garages, wall, limit: 5, approach,
          set: new Set(idxs), entrySet: new Set(idxs.slice(0, 3)),        // track samples alongside the pit / at its mouth
          inIdx: Math.round(RIN / PIT_STEP), outIdx: Math.round((L - ROUT) / PIT_STEP), // speed-limit lines, as path indices
          lineIn: offset(along(entry, RIN), side * PIT_OFF), lineOut: offset(along(entry, L - ROUT), side * PIT_OFF) };
}

function polyline(c, pts) { c.beginPath(); pts.forEach((p, k) => k ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.stroke(); }
function runs(c, filter) { // stroke continuous runs of samples that pass filter
  c.beginPath(); let on = false;
  for (let i = 0; i <= N; i++) {
    const k = i % N;
    if (filter(k)) { on ? c.lineTo(P[k].x, P[k].y) : c.moveTo(P[k].x, P[k].y); on = true; } else on = false;
  }
  c.stroke();
}
function segs(c, wf, col) { // per-segment strokes (variable width)
  c.strokeStyle = col;
  for (let i = 0; i < N; i++) {
    const p = P[i], q = P[(i + 1) % N];
    c.lineWidth = wf(i); c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); c.stroke();
  }
}
function build(c, pal, vis) {
  c.fillStyle = pal.out; c.fillRect(0, 0, W, H);
  c.lineCap = c.lineJoin = 'round';
  if (vis) {                                                   // barriers
    segs(c, i => ro[i] * 2 + 14, pal.wall);
    c.lineWidth = PIT_W + 14; c.strokeStyle = pal.wall; polyline(c, pit.path);
  }
  segs(c, i => ro[i] * 2, pal.run);                            // runoff
  c.fillStyle = pal.grav;                                      // gravel traps on corner outsides
  for (let i = 0; i < N; i += 2) if (corner[i] && !street[i]) {

// AI pit strategy. Each driver decides at the start how many stops to make: the fewest the tyres allow,

const TYRE_PER_LAP = .86;          // tyre lost per lap by the AI on a clean lap, x TYRE_LIFE (measured)

const tyresAllowPit = c => !wearOn() || c.tyre < PIT_BELOW;

// ---- 100% damage: the car is wrecked. It stops where it is and burns until the marshals clear it (then it's

function burnTick(c) { // flames and black smoke from a wreck (or just smoke from a dead engine), then it's cleared away

function towTick() { // slipstream: how much each car is tucked in behind another (0-1), eased in and out

    let t = 0;

      const fx = Math.cos(c.a), fy = Math.sin(c.a);

    if (d === 0 || d >= 26 || inLane(a) || inLane(b) || apart(a, b) || a.gone || b.gone) continue; // no contact in the pit lane, or over/under a bridge
    if (a.out && b.out) continue;

const lateral = c => (c.y - P[c.idx].y) * Math.cos(ang[c.idx]) - (c.x - P[c.idx].x) * Math.sin(ang[c.idx]); // + = right of centreline
function flagsTick() {

  for (const c of cars) { // yellow: a car stranded off the track, or reversing out of trouble
    if (c.done || c.gone || c.pitting || c.inPit || c.service || Math.abs(c.f) > 1.5 || !(c.out || c.s >= 2 || c.rev > 0 || c.stuck > 20)) continue;

  }

    c.blue = null; // blue: a car from (at least) half a lap ahead is right behind us (not under the safety car)

function pickTV() { // auto-director: show the closest battle on track, or the leader

  if (sc && !sc.gone) { specTarget = running[0]; caption = '🚨 Safety car — the leader follows it round'; return; }
  if (step < GO + 120) { specTarget = order[0]; caption = 'Lights out!'; return; }
  let best = -1, bg = 1.2;

    if (g < bg && running[i - 1].maxS - running[i].maxS < N) { bg = g; best = i; }
  }

    specTarget = running[best];
    caption = `Battle for P${order.indexOf(running[best - 1]) + 1}: ${running[best - 1].name} vs ${running[best].name}`;

}

function update() {

  for (const q of confetti) { q.x += q.vx; q.y += q.vy; q.r += .1; }

    if (!replay.pause) replay.t = clamp(replay.t + replay.speed / 2, 0, tape.length - 1);

  }

  if (step === GO) beep(880, .4);                   // ...and go out
  if (car && racing() && step > GO && step % 10 === 0) { // gained / lost a place: flash it by your position
    const p = position(car);
    if (car.lastPos && p !== car.lastPos && !car.out) car.posFlash = { d: car.lastPos - p, until: step + 150 };
    car.lastPos = p;
  }
  const go = step > GO;
  const up = car && go && !car.done && !car.service && !car.out && keys.ArrowUp;
  towTick();
  if (car && !car.gone) {
    if (car.service) serviceTick(car);
    else if (car.out) physics(car, false, false, 0); // wrecked: grinds to a stop
    else physics(car, up, go && !car.done && keys.ArrowDown, (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0));
    // Pit stop: come to a stop on any pit box and the crew fits fresh tyres
    if (!car.service && !car.out && car.inPit && ((wearOn() && car.tyre < .97) || car.dmg > .05) && Math.abs(car.f) < .3 && !car.done &&
        pit.boxes.some(b => (b.x - car.x) ** 2 + (b.y - car.y) ** 2 < 26 * 26)) {
      car.service = car.serviceMax = PIT_TIME;
      say(`🔧 You pit from P${position(car)}`, '#9cf');
    }
  }
  for (const c of ais) c.gone ? 0 : c.out ? physics(c, false, false, 0) : c.service ? serviceTick(c) : go ? aiDrive(c) : physics(c, false, false, 0);
  for (const c of cars) if (c.out && !c.gone) burnTick(c);
  collide();
  for (const c of cars) if (!c.gone) progress(c, go);
  if (sc) finishers.length || finished ? sc = null : scTick();
  if (racing() && go && !finished && cars.every(c => c.done || c.out)) finished = true; // everyone still running has finished
  if (go && mode === 'trial') rec.push([car.x, car.y, car.a]);
  if (car) car.wrong = car.f > 1 && Math.cos(car.a - ang[car.idx]) < -.3;
  // Spectate: if someone is stuck forever, end the race 45s after the winner
  if (mode === 'spectate' && finishers.length && !finished && step - finishers[0].finishStep > 60 * 45) finished = true;
  if (season && finished && !season.awarded) awardPoints();
  if (racing()) flagsTick();
  weatherTick();
  if (racing() && go && !finished && step % 2 === 0) { // record for the replay
    const fr = new Float32Array(cars.length * 4);
    cars.forEach((c, i) => fr.set([c.x, c.y, c.a, (c.brake ? 1 : 0) + (c.level === 1 ? 2 : c.level === -1 ? 4 : 0)], i * 4)); // flags: brake, on/under bridge
    tape.push(fr);
  }
  // Commentary: overtakes (ignoring places swapped by pit stops, and the same pair swapping back and forth)
  if (racing() && step > GO + 120 && step % 20 === 0) {
    const order = standings();
    for (let i = 0; i < order.length - 1; i++) {
      const a = order[i], b = order[i + 1];
      if (!lastOrder.includes(a) || lastOrder.indexOf(a) < lastOrder.indexOf(b)) continue;
      if (a.done || b.done || a.out || b.out || a.inPit || b.inPit || b.service || a.pitting || b.pitting) continue;
      const key = [a.name, b.name].sort().join();
      if (step - (passLog.get(key) ?? -1e9) > 240)
        say(`${a === car ? 'You pass' : a.name + ' passes'} ${b === car ? 'you' : b.name} for P${i + 1}`, a === car || b === car ? '#ffd84a' : '#fff');
      passLog.set(key, step);
    }
    lastOrder = order;
  }

  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.life--; }
  parts = parts.filter(p => p.life > 0);
  shake *= .85;
  if (flashT > 0) flashT--;

  // Camera
  const watch = watching();
  if (watch && specCam === 'free') { // pan with the arrows, zoom with + / -
    const sp = 12 / zm;
    if (keys.ArrowLeft) cam.x -= sp; if (keys.ArrowRight) cam.x += sp;
    if (keys.ArrowUp) cam.y -= sp; if (keys.ArrowDown) cam.y += sp;
    if (keys['+'] || keys['=']) zm *= 1.025; if (keys['-'] || keys['_']) zm /= 1.025;
    clampCam();
  } else if (watch && specCam === 'overview') {
    cam.x += (W / 2 - cam.x) * .06; cam.y += (H / 2 - cam.y) * .06;
    zm += (Math.min(VW / W, VH / H) * .97 - zm) * .06;
  } else {
    if (watch && specCam === 'tv' && step >= tvNext) { pickTV(); tvNext = step + 360; }
    const t = watch ? specTarget : car;
    cam.x += (t.x + t.vx * 14 - cam.x) * .08;
    cam.y += (t.y + t.vy * 14 - cam.y) * .08;
    zm += (.92 - Math.min(1, Math.abs(t.f) / 14) * .17 - zm) * .03; // zoom out at speed
  }

  const heard = watch ? specTarget : car; // engine note: yours, or the car being watched
  if (gain) engineSound(heard, heard === car ? up : (heard.f < 10.8 && !heard.brake));
}
function puff(c, col, life) {
  const fx = Math.cos(c.a), fy = Math.sin(c.a);

}

function drawNight(tf, dark, list = cars) {
  lx.setTransform(1, 0, 0, 1, 0, 0); lx.globalCompositeOperation = 'source-over';

    g.addColorStop(0, 'rgba(0,0,0,.9)'); g.addColorStop(.5, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = g; lx.beginPath(); lx.arc(l.x, l.y, 240, 0, 7); lx.fill();

  drawPodium(x + 200, y + 250, finishers.slice(0, 3));
  const grid = car.posHist[0] || pos, gained = grid - pos, sx = x + 430;
  const stat = (k, label, val, col = '#fff') => { txt(label, sx, y + 112 + k * 26, F(11, true), DIM); txt(val, sx + 150, y + 112 + k * 26, F(16, true), col); };
  stat(0, 'GRID → FINISH', `P${grid} → P${pos}`);
  txt(gained > 0 ? `▲ ${gained}` : gained < 0 ? `▼ ${-gained}` : '=', sx + 330, y + 112, F(16, true), gained > 0 ? GOOD : gained < 0 ? BAD : DIM, 'right');
  stat(1, 'TOTAL TIME', `${lapTimes.reduce((a, b) => a + b, 0).toFixed(2)}s`);
  stat(2, 'YOUR BEST LAP', fmt(car.best), '#b98cff');
  stat(3, 'FASTEST LAP', `${raceFast.name} ${fmt(raceFast.t)}`, raceFast.name === 'You' ? '#b98cff' : '#fff');
  if (wearOn()) stat(4, 'PIT STOPS', String(car.stops));
  stat(wearOn() ? 5 : 4, 'WALL HITS', String(hits));
  drawPosChart(x + 30, y + 296, w - 60, 120, car.posHist, n);
  const bw = 170, bx = VW / 2 - (bw * 3 + 24) / 2, byy = y + h - 54;
  button('Race again (R)', bx, byy, bw, 38, () => reset(), true);
  button('Replay (V)', bx + bw + 12, byy, bw, 38, startReplay);
  button('Menu (Esc)', bx + 2 * (bw + 12), byy, bw, 38, quitToMenu);
}
function drawSpecResult() { // the full result: podium on top, then everyone (in columns for a big field)
  const res = [...finishers, ...standings().filter(c => !c.done)], L = listLayout(res.length), w = Math.max(L.pw, 560);
  const h = 60 + 126 + L.per * L.rh + 90, x = VW / 2 - w / 2, y = Math.max(8, VH / 2 - h / 2);
  panel(x, y, w, h, 16);
  txt(car && car.out ? 'RACE RESULT — you retired' : 'RACE RESULT', VW / 2, y + 38, F(26, true), ACC, 'center');
  drawPodium(VW / 2, y + 174, finishers.slice(0, 3), .8);
  let ly = y + 206;
  res.forEach((c, i) => {
    const cx = VW / 2 - L.pw / 2 + 10 + Math.floor(i / L.per) * L.cw, yy = ly + (i % L.per) * L.rh, me = c === car;
    ctx.fillStyle = c.col; ctx.fillRect(cx + 20, yy - 10, 10, 10);
    txt(`${i + 1}. ${c.name}`, cx + 38, yy, (me ? 'bold ' : '') + L.font, me ? ACC : '#fff');
    if (wearOn()) txt(`${c.stops} stop${c.stops === 1 ? '' : 's'}`, cx + L.cw * .62, yy, F(12), INFO, 'right');
    const t = !c.done ? (c.out ? 'DNF' : '—') : i === 0 ? `${((c.finishStep - GO) / 60).toFixed(2)}s` : `+${((c.finishStep - finishers[0].finishStep) / 60).toFixed(2)}`;
    txt(t, cx + L.cw - 20, yy, L.font, c.out ? BAD : '#ddd', 'right');
  });
  ly += L.per * L.rh + 6;
  txt(`Fastest lap: ${raceFast.name} ${fmt(raceFast.t)}`, VW / 2, ly + 8, F(14), '#b98cff', 'center');
  const bw = 150, bx = VW / 2 - (bw * 3 + 24) / 2;
  button(mode === 'race' ? 'Race again (R)' : 'Rerun (R)', bx, ly + 24, bw, 36, () => reset(), true);
  button('Replay (V)', bx + bw + 12, ly + 24, bw, 36, startReplay);
  button('Menu (Esc)', bx + 2 * (bw + 12), ly + 24, bw, 36, quitToMenu);
}

let deckA = 1; // bridge deck opacity: fades out while the car we're watching drives underneath
let shownSpd = 0; // speedometer reading, eased towards the real speed
function drawBridge(hide) {
  deckA += ((hide ? 0 : 1) - deckA) * .2;
  if (deckA < .02) return;
  const pts = bridge.deck.map(i => P[i]);
  ctx.save(); ctx.globalAlpha = deckA; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
  ctx.translate(16, 16); ctx.lineWidth = TW + 30; ctx.strokeStyle = 'rgba(0,0,0,.35)'; polyline(ctx, pts); ctx.translate(-16, -16); // shadow
  ctx.lineWidth = TW + 30; ctx.strokeStyle = '#8d8d94'; polyline(ctx, pts);   // concrete sides
  ctx.lineWidth = TW + 18; ctx.strokeStyle = '#d6d6dc'; polyline(ctx, pts);   // parapets
  ctx.lineWidth = TW + 4; ctx.strokeStyle = '#eee'; polyline(ctx, pts);       // white edge lines
  ctx.lineWidth = TW; ctx.strokeStyle = T.pal.asph; polyline(ctx, pts);       // tarmac
  ctx.restore();
}
function draw() {
  uiHits = []; // (buttons and rows register themselves as they're drawn)
  setT(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = T.pal.out; ctx.fillRect(0, 0, VW, VH);
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  const tf = [zm, 0, 0, zm, Math.round(VW / 2 - cam.x * zm + sx), Math.round(VH / 2 - cam.y * zm + sy)];
  setT(...tf);
  const x0 = Math.max(0, cam.x - VW / zm / 2 - 20), y0 = Math.max(0, cam.y - VH / zm / 2 - 20);
  const w0 = Math.min(W - x0, VW / zm + 40), h0 = Math.min(H - y0, VH / zm + 40);
  if (w0 > 0 && h0 > 0) { ctx.drawImage(tc, x0, y0, w0, h0, x0, y0, w0, h0); ctx.drawImage(skc, x0, y0, w0, h0, x0, y0, w0, h0); }
  drawCrowds();
  if (bridge && (mode === 'menu' || mode === 'qresult')) drawBridge(false);
  if (mode === 'menu' || mode === 'qresult') { setT(1, 0, 0, 1, 0, 0); mode === 'menu' ? drawMenu() : drawQuali(); if (helpOpen) drawHelp(); return; }
  if (mode === 'replay') { drawReplay(tf); if (helpOpen) drawHelp(); return; }

  const spec = watching(), race = mode === 'race', free = spec && specCam === 'free';
  const over = spec && (specCam === 'overview' || (free && zm < .45)); // zoomed right out: numbered discs instead of name tags
  for (const p of parts) {
    ctx.fillStyle = `rgba(${p.c},${(p.life / p.max) * .6})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + (p.max - p.life) * .2, 0, 7); ctx.fill();
  }
  const vs = rivalHere(), gl = vs ? vs.frames : ghost, g = mode === 'trial' && gl && gl[car.lapStep]; // a friend's ghost beats your own
  if (g) {
    ctx.globalAlpha = .35; drawCar(g[0], g[1], g[2], 0, vs ? '#9cf' : '#fff', false); ctx.globalAlpha = 1;
    if (vs) txt(vs.name, g[0], g[1] - 22, `bold ${Math.round(12 / zm)}px system-ui`, 'rgba(200,230,255,.85)', 'center');
  }
  const drawRacer = c => {
    if (c.gone) return;
    if (!c.out || !c.fire) { drawCar(c.x, c.y, c.a, c.steer, c.col, c.brake); return; } // (a dead engine just sits there)
    const fl = .5 + Math.random() * .5; // a wreck: charred, with the fire glowing under it
    ctx.fillStyle = `rgba(255,110,20,${.35 * fl})`; ctx.beginPath(); ctx.arc(c.x, c.y, 30 + fl * 10, 0, 7); ctx.fill();
    drawCar(c.x, c.y, c.a, 0, '#2a2522', false);
    for (let k = 0; k < 5; k++) { // flames licking up off the wreck
      const fx = c.x + rnd(-12, 12), fy = c.y + rnd(-7, 7), r = rnd(4, 9);
      ctx.fillStyle = k % 2 ? 'rgba(255,90,10,.85)' : 'rgba(255,200,40,.9)';
      ctx.beginPath(); ctx.moveTo(fx - r, fy); ctx.quadraticCurveTo(fx, fy - r * 2.6, fx + r, fy); ctx.arc(fx, fy, r, 0, Math.PI); ctx.fill();
    }
  };
  for (const c of cars) if (c.level !== 1) drawRacer(c);
  if (bridge) { // the bridge deck goes over the cars below it (unless we're watching one of them), then the cars on it
    const v = spec ? specTarget : car;
    drawBridge(!over && !free && v && v.level === -1);
    for (const c of cars) if (c.level === 1) drawRacer(c);
  }
  for (const c of cars) if (c.tow > .2 && !c.gone) { // slipstream: air streaming past a car tucked in behind another
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
    ctx.strokeStyle = `rgba(255,255,255,${(c.tow - .2) * .5})`; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const k of [-12, -4, 4, 12]) { const o = (step * 5 + k * 7 + 400) % 44; ctx.moveTo(24 - o, k); ctx.lineTo(8 - o, k); }
    ctx.stroke(); ctx.restore();
  }
  if (sc && !sc.gone) { // the safety car, light bar flashing
    drawCar(sc.x, sc.y, sc.a, 0, '#e8e8e8', false);
    ctx.save(); ctx.translate(sc.x, sc.y); ctx.rotate(sc.a);
    ctx.fillStyle = '#222'; ctx.fillRect(-3, -7, 5, 14);
    ctx.fillStyle = step % 20 < 10 ? '#ffa500' : '#5a3a00'; ctx.fillRect(-2, -6, 3, 5);
    ctx.fillStyle = step % 20 < 10 ? '#5a3a00' : '#ffa500'; ctx.fillRect(-2, 1, 3, 5);
    ctx.restore();
    if (!over) txt('SAFETY CAR', sc.x, sc.y - 22, `bold ${Math.round(11 / zm)}px system-ui`, '#ffa500', 'center');
  }
  for (const c of cars) if (c.service) { // pit crew swarming the car, plus a progress bar
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
    for (const [x, y] of [[-10, -16], [10, -16], [-10, 16], [10, 16], [24, 0], [-24, 0]]) {
      const j = Math.sin(step * .4 + x + y) * 1.5;
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + j, y, 5, 0, 7); ctx.fill();
      ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(x + j, y, 3.5, 0, 7); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(c.x - 22, c.y + 24, 44, 6);
    ctx.fillStyle = '#9cf'; ctx.fillRect(c.x - 22, c.y + 24, 44 * (1 - c.service / c.serviceMax), 6);
  }
  for (const z of yellows) for (const s of [-1, 1]) { // marshals waving yellow flags on both sides of the incident
    const p = offset({ x: P[z.idx].x, y: P[z.idx].y, a: ang[z.idx] }, s * (ro[z.idx] + 4)), wave = Math.sin(step * .3) * 5;
    ctx.fillStyle = '#222'; ctx.fillRect(p.x - 1.5, p.y - 22, 3, 22);
    ctx.fillStyle = '#ffd400'; ctx.beginPath(); ctx.moveTo(p.x, p.y - 22); ctx.lineTo(p.x + 16, p.y - 17 + wave); ctx.lineTo(p.x, p.y - 11); ctx.fill();
  }
  if (opts.weather === 2) drawNight(tf, over ? .5 : .8, [...cars.filter(c => !c.out), ...(sc && !sc.gone ? [sc] : [])]);

  if (spec) { // markers: numbered discs when zoomed out, name tags when following
    setT(...tf);
    const order = standings();
    for (const c of cars) {
      const pos = order.indexOf(c) + 1;
      if (c.gone) continue;
      if (over) {
        ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(c.x, c.y, 10 / zm, 0, 7); ctx.fill();
        ctx.lineWidth = (c === specTarget ? 3 : 1.5) / zm; ctx.strokeStyle = c === specTarget ? '#fff' : '#000'; ctx.stroke();
        ctx.font = `bold ${Math.round(11 / zm)}px system-ui`; ctx.textAlign = 'center';
        ctx.lineWidth = 3 / zm; ctx.strokeStyle = '#000'; ctx.strokeText(pos, c.x, c.y + 4 / zm);
        ctx.fillStyle = '#fff'; ctx.fillText(pos, c.x, c.y + 4 / zm);
      } else {
        const label = `${pos} ${c.name}`, fs = Math.round(12 / zm);
        ctx.font = `bold ${fs}px system-ui`; const w = ctx.measureText(label).width + 10 / zm;
        ctx.fillStyle = c === specTarget ? 'rgba(255,216,74,.85)' : 'rgba(0,0,0,.55)';
        ctx.fillRect(c.x - w / 2, c.y - 26 / zm - fs, w, fs + 6 / zm);
        txt(label, c.x, c.y - 26 / zm, ctx.font, c === specTarget ? '#000' : '#fff', 'center');
      }
    }
  }
  setT(1, 0, 0, 1, 0, 0);
  if (wet > .01 || rainNow > .01) { // rain (heavier as a shower builds), and a darker sheen while the track is wet
    ctx.fillStyle = `rgba(30,40,65,${.25 * Math.max(rainNow, wet * .5)})`; ctx.fillRect(0, 0, VW, VH);
    ctx.strokeStyle = 'rgba(190,205,255,.35)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let k = 0, n = drops.length * rainNow; k < n; k++) { const d = drops[k]; ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 5 * d.s, d.y - 18 * d.s); }
    ctx.stroke();
  }

  // ---- HUD ----
  let leftEdge = 12; // (right edge of the panels on the left, so the notices can centre between them and the minimap)
  if (spec) { // timing tower (with the lap), camera buttons
    const lead = standings()[0], tag = race ? 'RETIRED · WATCHING' : season ? `ROUND ${season.round + 1}/${season.tracks.length}` : 'SPECTATING';
    drawTower(12, 12, free ? null : specTarget, `LAP ${Math.min(lead.laps + 1, opts.laps)}/${opts.laps}`, tag, race ? '#f96' : INFO);
    leftEdge = 12 + (wearOn() ? 262 : 226);
    drawCamBar();
  } else { // your times, then the timing tower (race) or your recent laps (time trial / qualifying)
    const th = drawTimes();
    leftEdge = 274;
    if (race) drawTower(12, 12 + th + 8, car);
    else if (lapTimes.length) {
      const recent = lapTimes.slice(-5), best = Math.min(...lapTimes);
      panel(12, 12 + th + 8, 170, 16 + recent.length * 22);
      recent.forEach((lt, i) => txt(`Lap ${lapTimes.length - recent.length + i + 1}   ${lt.toFixed(2)}`, 26, 12 + th + 30 + i * 22, F(14), lt === best ? '#b98cff' : '#ddd'));
    }
  }
  const hc = spec ? specTarget : car; // (you, or the car being watched)
  mmLeft = VW;
  if (!over) {
    if (!free && hc) { if (hc !== car || car.out) drawCard(hc); drawSpeedo(hc); } // (no speedo in the free camera)
    drawMinimap(hc, g, free);
  }
  drawLights((leftEdge + mmLeft) / 2);
  drawNotices(spec, race, leftEdge);
  if (racing() && !(finished && season)) drawFeed(12, spec ? VH - 78 : VH - 16);
  if (finished && (!season || season.awarded)) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, VW, VH); } // (results: dim the HUD behind)
  if (finished && season && season.awarded) drawSeason();
  else if (finished && !spec) drawRaceResult();
  else if (finished && spec) drawSpecResult();
  for (const q of confetti) {
    if (q.y > VH) continue;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-4, -2, 8, 4); ctx.restore();
  }
  if (paused) drawPause();
  if (helpOpen) drawHelp();
}

fitScreen();
loadTrack(RANDOM_TRACK() ? 0 : opts.track);
let acc = 0, last = performance.now();
(function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
